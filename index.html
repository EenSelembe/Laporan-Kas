<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Keuangan</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  padding: 10px;
}

h2 { text-align: center; }

input, button {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  font-size: 16px;
  border: none;
  border-radius: 5px;
}

input {
  background: #222;
  color: #fff;
}

button {
  background: #28a745;
  color: white;
  font-weight: bold;
}

table {
  width: 100%;
  margin-top: 15px;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #444;
  padding: 8px;
  text-align: center;
  font-size: 14px;
}

th {
  background: #333;
}

tr.data-row:hover {
  background: #222;
  cursor: pointer;
}

.hapus {
  cursor: pointer;
  font-size: 18px;
}

.saldo {
  font-size: 18px;
  text-align: center;
  margin-top: 10px;
  color: #00ffcc;
}
</style>
</head>

<body>

<h2>LAPORAN KEUANGAN</h2>

<input type="text" id="keterangan" placeholder="Keterangan">

<input type="text" id="pemasukan" placeholder="Pemasukan (Rp)" inputmode="numeric" pattern="[0-9.]*">
<input type="text" id="pengeluaran" placeholder="Pengeluaran (Rp)" inputmode="numeric" pattern="[0-9.]*">

<button onclick="tambahData()">Tambah / Update</button>

<div class="saldo" id="saldo">Saldo: Rp 0</div>

<table>
<thead>
<tr>
  <th>Tanggal</th>
  <th>Keterangan</th>
  <th>Pemasukan</th>
  <th>Pengeluaran</th>
  <th>Saldo</th>
  <th>Hapus</th>
</tr>
</thead>
<tbody id="tabel"></tbody>
</table>

<script>
let data = JSON.parse(localStorage.getItem("keuangan")) || [];
let editIndex = -1;

function simpan() {
  localStorage.setItem("keuangan", JSON.stringify(data));
}

// tanggal otomatis
function getTanggal() {
  let d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
}

// format rupiah
function formatRupiah(angka) {
  return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// parse rupiah
function parseRupiah(val) {
  return parseInt(val.replace(/\./g, "")) || 0;
}

// input auto titik
function setupFormat(id) {
  let input = document.getElementById(id);

  input.addEventListener("input", function () {
    let val = this.value.replace(/\./g, "");
    if (!isNaN(val)) {
      this.value = formatRupiah(val);
    }
  });
}

setupFormat("pemasukan");
setupFormat("pengeluaran");

// hitung saldo per baris
function hitungSaldo(arr) {
  let saldo = 0;
  return arr.map(item => {
    saldo += item.pemasukan - item.pengeluaran;
    return { ...item, saldo };
  });
}

// render aman (FIX INDEX TOTAL)
function render() {
  let tabel = document.getElementById("tabel");
  tabel.innerHTML = "";

  let processed = hitungSaldo(data);

  // index asli aman sebelum reverse
  let list = processed.map((item, index) => ({ item, index })).reverse();

  list.forEach(({ item, index }) => {

    tabel.innerHTML += `
      <tr class="data-row" onclick="editData(${index})">
        <td>${item.tanggal}</td>
        <td>${item.keterangan}</td>
        <td>${formatRupiah(item.pemasukan)}</td>
        <td>${formatRupiah(item.pengeluaran)}</td>
        <td>${formatRupiah(item.saldo)}</td>
        <td onclick="event.stopPropagation(); hapusData(${index})" class="hapus">🗑️</td>
      </tr>
    `;
  });

  let total = data.reduce((a,b)=>a + (b.pemasukan - b.pengeluaran),0);

  document.getElementById("saldo").innerText =
    "Saldo: Rp " + formatRupiah(total);
}

// tambah / update
function tambahData() {
  let keterangan = document.getElementById("keterangan").value;
  let pemasukan = parseRupiah(document.getElementById("pemasukan").value);
  let pengeluaran = parseRupiah(document.getElementById("pengeluaran").value);

  if (!keterangan) {
    alert("Isi keterangan!");
    return;
  }

  let obj = {
    tanggal: getTanggal(),
    keterangan,
    pemasukan,
    pengeluaran
  };

  if (editIndex === -1) {
    data.push(obj);
  } else {
    data[editIndex] = obj;
    editIndex = -1;
  }

  simpan();
  render();
  resetForm();
}

// klik baris = edit
function editData(index) {
  let item = data[index];

  document.getElementById("keterangan").value = item.keterangan;
  document.getElementById("pemasukan").value = formatRupiah(item.pemasukan);
  document.getElementById("pengeluaran").value = formatRupiah(item.pengeluaran);

  editIndex = index;
}

// hapus aman
function hapusData(index) {
  if (confirm("Hapus data ini?")) {
    data.splice(index, 1);
    simpan();
    render();
  }
}

// reset form
function resetForm() {
  document.getElementById("keterangan").value = "";
  document.getElementById("pemasukan").value = "";
  document.getElementById("pengeluaran").value = "";
}

render();
</script>

</body>
</html>
