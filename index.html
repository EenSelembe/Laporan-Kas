<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Keuangan</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  padding: 10px;
}

h2 { text-align: center; }

input, button {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  font-size: 16px;
  border: none;
  border-radius: 5px;
}

input {
  background: #222;
  color: #fff;
}

button {
  background: #28a745;
  color: white;
  font-weight: bold;
}

table {
  width: 100%;
  margin-top: 15px;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #444;
  padding: 8px;
  text-align: center;
  font-size: 14px;
}

th {
  background: #333;
}

tr:nth-child(even) {
  background: #1a1a1a;
}

.saldo {
  font-size: 18px;
  text-align: center;
  margin-top: 10px;
  color: #00ffcc;
}

.btn {
  padding: 5px;
  font-size: 12px;
  margin: 2px;
  border-radius: 3px;
  cursor: pointer;
}

.edit { background: orange; color: #000; }
.hapus { background: red; color: #fff; }
</style>
</head>

<body>

<h2>LAPORAN KEUANGAN</h2>

<input type="text" id="keterangan" placeholder="Keterangan">

<!-- INPUT UANG (keyboard HP angka) -->
<input type="text" id="pemasukan" placeholder="Pemasukan (Rp)" inputmode="numeric" pattern="[0-9.]*">
<input type="text" id="pengeluaran" placeholder="Pengeluaran (Rp)" inputmode="numeric" pattern="[0-9.]*">

<button onclick="tambahData()">Tambah</button>

<div class="saldo" id="saldo">Saldo: Rp 0</div>

<table>
<thead>
<tr>
  <th>Tanggal</th>
  <th>Keterangan</th>
  <th>Pemasukan</th>
  <th>Pengeluaran</th>
  <th>Saldo</th>
  <th>Aksi</th>
</tr>
</thead>
<tbody id="tabel"></tbody>
</table>

<script>
let data = JSON.parse(localStorage.getItem("keuangan")) || [];
let editIndex = -1;

function simpan() {
  localStorage.setItem("keuangan", JSON.stringify(data));
}

// tanggal otomatis
function getTanggal() {
  let d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
}

// format ribuan
function formatRupiah(angka) {
  return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// ambil angka asli
function parseRupiah(val) {
  return parseInt(val.replace(/\./g, "")) || 0;
}

// auto format titik saat ketik
function setupFormat(id) {
  let input = document.getElementById(id);

  input.addEventListener("input", function () {
    let val = this.value.replace(/\./g, "");
    if (!isNaN(val)) {
      this.value = formatRupiah(val);
    }
  });
}

setupFormat("pemasukan");
setupFormat("pengeluaran");

function render() {
  let tabel = document.getElementById("tabel");
  tabel.innerHTML = "";

  let saldo = 0;

  data.forEach((item, index) => {
    saldo += item.pemasukan - item.pengeluaran;

    tabel.innerHTML += `
      <tr>
        <td>${item.tanggal}</td>
        <td>${item.keterangan}</td>
        <td>${formatRupiah(item.pemasukan)}</td>
        <td>${formatRupiah(item.pengeluaran)}</td>
        <td>${formatRupiah(saldo)}</td>
        <td>
          <button class="btn edit" onclick="editData(${index})">Edit</button>
          <button class="btn hapus" onclick="hapusData(${index})">Hapus</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("saldo").innerText =
    "Saldo: Rp " + formatRupiah(saldo);
}

function tambahData() {
  let keterangan = document.getElementById("keterangan").value;
  let pemasukan = parseRupiah(document.getElementById("pemasukan").value);
  let pengeluaran = parseRupiah(document.getElementById("pengeluaran").value);

  if (!keterangan) {
    alert("Isi keterangan!");
    return;
  }

  let tanggal = getTanggal();

  let obj = {
    tanggal,
    keterangan,
    pemasukan,
    pengeluaran
  };

  if (editIndex === -1) {
    data.push(obj);
  } else {
    data[editIndex] = obj;
    editIndex = -1;
  }

  simpan();
  render();
  resetForm();
}

function editData(index) {
  let item = data[index];

  document.getElementById("keterangan").value = item.keterangan;
  document.getElementById("pemasukan").value = formatRupiah(item.pemasukan);
  document.getElementById("pengeluaran").value = formatRupiah(item.pengeluaran);

  editIndex = index;
}

function hapusData(index) {
  if (confirm("Hapus data ini?")) {
    data.splice(index, 1);
    simpan();
    render();
  }
}

function resetForm() {
  document.getElementById("keterangan").value = "";
  document.getElementById("pemasukan").value = "";
  document.getElementById("pengeluaran").value = "";
}

render();
</script>

</body>
</html>
